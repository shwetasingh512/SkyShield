{% extends 'base.html' %}

{% block title %}500 Internal Error &bull; SkyShield{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-3 p-5">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
            </div>
            <h2 class="fw-bold text-navy mb-2">500 &bull; Operational Telemetry Error</h2>
            <p class="text-muted mb-4">
                An unexpected server condition was encountered. The event has been logged to the internal diagnostic journal.
            </p>
            <div>
                <a href="{% url 'dashboard:index' %}" class="btn btn-primary fw-semibold">
                    <i class="bi bi-house-door me-1"></i>Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
