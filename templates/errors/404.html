{% extends 'base.html' %}

{% block title %}404 Not Found &bull; SkyShield{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="card border-0 shadow-sm rounded-3 p-5">
            <div class="mb-3">
                <i class="bi bi-airplane text-secondary" style="font-size: 4rem;"></i>
            </div>
            <h2 class="fw-bold text-navy mb-2">404 &bull; Record Not Found</h2>
            <p class="text-muted mb-4">

            </p>
            <div>
                <a href="{% url 'dashboard:index' %}" class="btn btn-primary fw-semibold">
                    <i class="bi bi-house-door me-1"></i>Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
