<header class="app-header">
    <div class="d-flex align-items-center">
        <button class="btn btn-outline-secondary d-lg-none me-3" id="sidebarToggleBtn" aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="fs-5 fw-bold text-navy text-truncate">
            {% block page_title %}Aviation Safety Management System{% endblock %}
        </span>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Role Indicator Badge -->
        <span class="badge badge-role {{ request.user.role_badge_class }}">
            <i class="bi bi-shield-check me-1"></i>{{ user_role_display }}
        </span>

        <!-- User Dropdown Menu -->
        <div class="dropdown">
            <button class="btn btn-light border dropdown-toggle d-flex align-items-center py-1 px-3" type="button" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-fill me-2 text-primary"></i>
                <span class="d-none d-md-inline fw-semibold">{{ request.user.username }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userMenuBtn">
                <li>
                    <h6 class="dropdown-header">
                        {{ request.user.get_full_name|default:request.user.username }}<br>
                        <small class="text-muted">{{ request.user.email }}</small>
                    </h6>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{% url 'accounts:profile' %}">
                        <i class="bi bi-person-badge me-2 text-secondary"></i>My Profile
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" href="{% url 'accounts:password_change' %}">
                        <i class="bi bi-key me-2 text-secondary"></i>Change Password
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item text-danger" href="{% url 'accounts:logout' %}">
                        <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
